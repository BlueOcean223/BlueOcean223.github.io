<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>打开终端窗口时在工作的三方</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #faf9f5; --bg-soft: #f0eee6; --text: #141413; --text-soft: #3d3c38; --muted: #5e5d59; --faint: #87867f; --faint-2: #b0aea5;
  --border: #e8e6dc; --border-strong: #d8d4c7; --accent: #d97757; --accent-hover: #c15f3f;
  --cloud: #c5d3e0; --matcha: #ced6bf; --manilla: #ebdbbc;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: var(--font-sans); color: var(--text); font-size: 14px; line-height: 1.6; padding: 16px 18px 14px; -webkit-font-smoothing: antialiased; }

.flow { display: grid; grid-template-columns: 228px minmax(56px, 1fr) 300px minmax(56px, 1fr) 136px; grid-template-areas: "t w1 k w2 s" "tc . kc . sc"; }
.box { border-radius: 10px; border: 1px solid var(--border); background: var(--bg); position: relative; }
.nm { font: 600 14px/1.3 var(--font-sans); margin-top: 8px; }
.rl { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
#bt { grid-area: t; } #ct { grid-area: tc; } #bk { grid-area: k; } #ck { grid-area: kc; } #bs { grid-area: s; } #cs { grid-area: sc; }
#w1 { grid-area: w1; } #w2 { grid-area: w2; }
#bt svg { display: block; width: 100%; }
#bk { background: #fbf6ec; border-color: var(--manilla); display: flex; flex-direction: column; padding: 10px 12px; }
.ktag { font: 600 11.5px var(--font-sans); color: #8a6d3b; letter-spacing: .04em; }
.pty { flex: 1; display: flex; align-items: center; margin-top: 4px; }
.port { flex: none; font: 12px var(--font-mono); background: #fff; border: 1px solid var(--manilla); border-radius: 6px; padding: 4px 6px; text-align: center; line-height: 1.35; }
.port small { display: block; font-size: 10px; color: var(--muted); }
#bs { padding: 10px 12px; font: 12.5px/1.7 var(--font-mono); background: #f4f7ef; border-color: var(--matcha); }
#bs .pn { font-weight: 600; font-family: var(--font-sans); font-size: 13px; }
#bs .fd { color: var(--text-soft); }
#bs .fd b { display: inline-block; width: 1.4em; font-weight: 600; color: var(--text); }
#bs .kid { color: var(--accent-hover); visibility: hidden; }
#bs .kid.on { visibility: visible; }

/* 连线：上面一条往右，下面一条往左；窄屏时竖过来 */
.wire, .pipe { position: relative; min-width: 0; }
.pipe { flex: 1; align-self: stretch; min-height: 60px; }
.ln { position: absolute; left: 6px; right: 6px; height: 0; border-top: 1.5px solid var(--border-strong); }
.ln.r { top: 38%; }
.ln.l { top: 62%; }
.ln.r::after, .ln.l::after { content: ""; position: absolute; top: -4.5px; border: 4px solid transparent; }
.ln.r::after { right: -2px; border-left: 6px solid var(--border-strong); border-right: 0; }
.ln.l::after { left: -2px; border-right: 6px solid var(--border-strong); border-left: 0; }
.wlab { position: absolute; left: 0; right: 0; top: calc(38% - 22px); text-align: center; font: 11px var(--font-mono); color: var(--faint); white-space: nowrap; }
.pk { position: absolute; transform: translate(-50%, -50%); font: 600 11.5px/1 var(--font-mono); padding: 3px 5px; border-radius: 5px; white-space: nowrap; background: #fff; border: 1.5px solid var(--accent); color: var(--text); }
.pk.back { border-color: #7a9cc6; }

@media (max-width: 640px) {
  .flow { grid-template-columns: min(300px, 100%); justify-content: center; grid-template-areas: "t" "tc" "w1" "k" "kc" "w2" "s" "sc"; }
  .wire { height: 64px; margin-top: 6px; }
  .pty { flex-direction: column; }
  .pipe { width: 100%; min-height: 70px; }
  .ln { top: 6px !important; bottom: 6px; height: auto; border-top: 0; border-left: 1.5px solid var(--border-strong); right: auto; }
  .ln.r { left: 38%; }
  .ln.l { left: 62%; }
  .ln.r::after { right: auto; top: auto; bottom: -2px; left: -4.5px; border: 4px solid transparent; border-top: 6px solid var(--border-strong); border-bottom: 0; }
  .ln.l::after { left: -4.5px; top: -2px; border: 4px solid transparent; border-bottom: 6px solid var(--border-strong); border-top: 0; }
  .wlab { top: 50%; left: auto; right: calc(62% + 14px); transform: translateY(-50%); text-align: right; }
}
.cap { font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<div class="flow">
  <div class="box" id="bt"><svg id="scene" viewBox="0 0 70 44" shape-rendering="crispEdges" role="img" aria-label="Clawd 在笔记本上的 Ghostty 里输入 ls"></svg></div>
  <div id="ct"><div class="nm">Ghostty</div><div class="rl">把按键变成字节发出去，把收到的字节画成字</div></div>
  <div class="wire" id="w1" data-seg="0"><div class="ln r"></div><div class="ln l"></div><div class="wlab">持有 master</div></div>
  <div class="box" id="bk">
    <div class="ktag">内核里的 pty</div>
    <div class="pty">
      <div class="port">master</div>
      <div class="pipe" data-seg="1"><div class="ln r"></div><div class="ln l"></div></div>
      <div class="port">slave<small>/dev/ttys003</small></div>
    </div>
  </div>
  <div id="ck"><div class="nm">pty</div><div class="rl">往 master 写的字节从 slave 读出来，反过来也一样</div></div>
  <div class="wire" id="w2" data-seg="2"><div class="ln r"></div><div class="ln l"></div><div class="wlab">fd 0 1 2</div></div>
  <div class="box" id="bs">
    <div class="pn">zsh</div>
    <div class="fd"><b>0</b>标准输入</div>
    <div class="fd"><b>1</b>标准输出</div>
    <div class="fd"><b>2</b>标准错误</div>
    <div class="kid" id="kid">└ ls</div>
  </div>
  <div id="cs"><div class="nm">zsh</div><div class="rl">读命令，启动程序</div></div>
</div>
<div class="cap">示意图。zsh 自己做行编辑，你敲的每个字都由它写回来再显示，所以每个字都走了一个来回。</div>

<script src="clawd.js"></script>
<script>
(() => {
  const { R, T, rects, clawd, every, sprite } = Clawd;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('scene');
  const layer = (x = 0, y = 0) => {
    const g = document.createElementNS(NS, 'g');
    if (x || y) g.setAttribute('transform', `translate(${x} ${y})`);
    svg.appendChild(g);
    return g;
  };
  // 笔记本：屏幕上是 Ghostty
  svg.innerHTML = R(0, 40, 70, 1, 'L')
    + R(27, 5, 39, 27, 'm') + R(28, 6, 37, 25, 'K') + R(28, 6, 37, 3, 'k') + R(29, 6, 9, 3, 'K') + R(30, 7, 6, 1, 'n')
    + R(23, 32, 46, 2, 'm') + R(23, 32, 46, 1, 'L') + R(24, 34, 44, 6, 'p');
  const scr = layer();
  const me = layer(4, 24);

  // 时间线（拍）：三个键依次发出，各自走到 zsh 再被写回来；回车之后 zsh 跑 ls，输出回到屏幕
  const SEG = [5, 7, 5];
  const LEN = SEG.reduce((a, b) => a + b, 0);
  const LOOP = 130;
  const packets = [
    { t: 6, txt: 'l', dir: 1 }, { t: 6 + LEN, txt: 'l', dir: -1, show: 'l' },
    { t: 14, txt: 's', dir: 1 }, { t: 14 + LEN, txt: 's', dir: -1, show: 's' },
    { t: 22, txt: '⏎', dir: 1 }, { t: 22 + LEN + 5, txt: 'a.txt', dir: -1 }, { t: 22 + LEN + 9, txt: 'b.txt', dir: -1, show: '\n' },
  ];
  const presses = [6, 14, 22];
  const done = 22 + 2 * LEN + 9;

  const segs = [...document.querySelectorAll('[data-seg]')].sort((a, b) => a.dataset.seg - b.dataset.seg);
  const vertical = () => matchMedia('(max-width: 640px)').matches;
  const chips = new Map();
  function place(p, i, t) {
    let el = chips.get(i);
    const dt = t - p.t;
    if (dt < 0 || dt > LEN) { if (el) el.remove(), chips.delete(i); return; }
    let s = 0, rest = dt;
    while (s < 2 && rest > SEG[p.dir > 0 ? s : 2 - s]) { rest -= SEG[p.dir > 0 ? s : 2 - s]; s++; }
    const seg = p.dir > 0 ? s : 2 - s;
    let f = rest / SEG[seg];
    if (p.dir < 0) f = 1 - f;
    if (!el || el.parentNode !== segs[seg]) {
      if (el) el.remove();
      el = document.createElement('span');
      el.className = 'pk' + (p.dir < 0 ? ' back' : '');
      el.textContent = p.txt;
      segs[seg].appendChild(el);
      chips.set(i, el);
    }
    // 换算成像素，让字节块整个留在线段里
    const lane = p.dir > 0 ? 38 : 62;
    const box = segs[seg];
    if (vertical()) {
      const h = el.offsetHeight / 2 + 4, H = box.clientHeight;
      el.style.left = lane + '%'; el.style.top = (h + f * (H - 2 * h)) + 'px';
    } else {
      const w = el.offsetWidth / 2 + 4, W = box.clientWidth;
      el.style.left = (W < 2 * w ? W / 2 : w + f * (W - 2 * w)) + 'px'; el.style.top = lane + '%';
    }
  }

  const frame = (o) => rects(clawd({ face: 'right', ...o }));
  const F = [frame({ arms: ['down', 'type1'] }), frame({ arms: ['down', 'type2'] }), frame({ arms: ['down', 'type1'], eyes: 'blink' }), frame({ arms: ['down', 'type1'], eyes: 'happy' })];
  me.innerHTML = F.map((f, i) => `<g${i ? ' display="none"' : ''}>${f}</g>`).join('');
  const kids = [...me.children];
  let shown = 0;
  const kid = document.getElementById('kid');

  every((tick) => {
    const t = Clawd.reduce ? done + 10 : tick % LOOP;
    // Clawd 的动作
    let f = 0;
    if (presses.some((p) => t >= p && t < p + 2)) f = 1;
    else if (t >= done && t < done + 18) f = 3;
    else if (t % 40 === 37) f = 2;
    if (f !== shown) { kids[shown].setAttribute('display', 'none'); kids[f].removeAttribute('display'); shown = f; }
    // 字节
    packets.forEach((p, i) => place(p, i, t));
    kid.classList.toggle('on', t >= 22 + LEN && t < 22 + LEN + 5);
    // 屏幕内容：写回来的字才画出来
    let line = '$ ', out = false;
    for (const p of packets) if (p.show && t >= p.t + LEN) { if (p.show === '\n') out = true; else line += p.show; }
    const cursorOn = Math.floor(t / 4) % 2 === 0;
    let s = T(30, 14, line, 3.6, 's');
    const cw = 3.6 * 0.6;
    if (out) {
      s += T(30, 19, 'a.txt  b.txt', 3.6, 'm') + T(30, 24, '$ ', 3.6, 's');
      if (cursorOn) s += R(30 + 2 * cw, 21.2, cw, 3.4, 's');
    } else if (cursorOn) s += R(30 + line.length * cw, 11.2, cw, 3.4, 's');
    scr.innerHTML = s;
  });
  addEventListener('resize', () => chips.forEach((el) => el.remove()) || chips.clear());
})();
</script>
</body>
</html>
