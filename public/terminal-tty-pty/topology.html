<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>谁持有 pty 的 master：几种常见的组合</title>

<style>

* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }

.btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }

.btn:disabled:hover { background: var(--bg); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 10px; }
.tn rect.box { stroke-width: 1.4; transition: fill .3s, stroke .3s, opacity .3s; }
.tn .t1 { font: 600 15px var(--font-sans); fill: var(--text); }
.tn .t2 { font: 12px var(--font-mono); fill: var(--muted); }
.tn.k-emu rect.box { fill: #e6edf4; stroke: var(--sky); }
.tn.k-mux rect.box { fill: #ebeaf3; stroke: var(--plum); }
.tn.k-prog rect.box { fill: #eef1e8; stroke: var(--olive); }
.tn.k-pty rect.box { fill: #f7efe2; stroke: var(--kraft); }
.tn.k-net rect.box { fill: #f6e9ef; stroke: var(--fig); }
.tn.k-file rect.box { fill: #fff; stroke: var(--faint); stroke-dasharray: 4 3; }
.tn.k-user rect.box { fill: #e7f0ed; stroke: var(--mineral); }
.tn .vt rect { fill: var(--plum); }
.tn .vt text { fill: #fff; font: 600 11.5px var(--font-sans); }
.tn .badge circle { stroke: #fff; stroke-width: 2; }
.tn { transition: opacity .3s; }
.tn.closed { opacity: .22; }
.tn.dead rect.box { stroke: var(--poppy); fill: #fbeaea; }
.tn.dead .t1 { fill: #b03a3a; text-decoration: line-through; }
.tn.alive rect.box { stroke: var(--olive); stroke-width: 2.6; }
.tn.suspend rect.box { stroke: var(--pencil); stroke-width: 2.6; }
.tn .stat { font: 600 12px var(--font-sans); }
.tn.dead .stat { fill: #b03a3a; } .tn.alive .stat { fill: #56693f; } .tn.suspend .stat { fill: #a86a1c; } .tn.closed .stat { fill: var(--faint); }
.te path { fill: none; stroke-width: 1.8; }
.te.k-pty path { stroke: var(--kraft); }
.te.k-sock path { stroke: var(--plum); stroke-dasharray: 6 4; }
.te.k-net path { stroke: var(--fig); }
.te.k-pipe path { stroke: var(--faint-2); }
.te.k-file path { stroke: var(--faint); stroke-dasharray: 2 4; }
.te.k-fd path { stroke: var(--accent); stroke-dasharray: 5 4; }
.te.k-pty circle { fill: #b98457; } .te.k-sock circle { fill: var(--plum); } .te.k-net circle { fill: var(--fig); }
.te.k-pipe circle, .te.k-file circle { fill: var(--faint); } .te.k-fd circle { fill: var(--accent); }
.te text { font: 12px var(--font-sans); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.te.cut path { stroke: var(--poppy); stroke-dasharray: 3 6; opacity: .5; }
.te.cut circle { display: none; }
.region rect { fill: rgba(229,202,218,.18); stroke: var(--fig); stroke-dasharray: 6 5; }
.region text { fill: var(--fig); font: 600 12px var(--font-sans); }
/* 各场景的说明长短不一，给一个能装下最长那段的高度 */
.info { display: grid; grid-template-columns: 1fr 1.35fr; gap: 6px 28px; align-items: start; margin-top: 14px; min-height: 216px; }
.info > * { min-width: 0; }
@media (max-width: 680px) { .info { grid-template-columns: 1fr; } }
.info h3 { margin: 0 0 8px; font: 600 16px var(--font-sans); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 0 0 10px; }
.facts dt { color: var(--muted); font-size: 12px; line-height: 1.75; }
.facts dd { margin: 0; }
.note { font-size: 13.5px; line-height: 1.7; color: var(--text-soft); }
.note p { margin: 0 0 8px; }
.hup { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.hup-log { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 42px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

        { id: 'pp', x: 300, y: 165, w: 170, h: 70, k: 'file', t: '3 根管道', s: 'stdin · stdout · stderr' },
        { id: 'z', x: 540, y: 155, w: 180, h: 90, k: 'prog', t: 'zsh -c "…"', s: 'TTY ??' },
        { id: 'o', x: 790, y: 165, w: 150, h: 70, k: 'user', t: 'tty 的输出', s: 'not a tty' },
      ],
      edges: [
        { a: 'app', b: 'pp', d: 'M230,200 L300,200', k: 'pipe' },
        { a: 'pp', b: 'z', d: 'M470,200 L540,200', k: 'pipe' },
        { a: 'z', b: 'o', d: 'M720,200 L790,200', k: 'pipe', flow: 'fwd' },
      ],
      facts: { 'pty': '0 对', 'VT 解析': '0 次', 'isatty': 'False' },
      note: '<p>Claude Code 的 Bash 工具用管道运行命令。在里面执行 <code>tty</code>，输出是 <code>not a tty</code>；用 <code>ps</code> 看，这个 zsh 的 TTY 一栏是 <code>??</code>，它没有控制终端。</p><p>结果是 <code>ls</code> 只输出单列、不带颜色，<code>git log</code> 不进分页器，vim、htop 这类要终端的程序没法正常运行。需要终端时可以套一层 <code>script</code>，或者像 pi-subagent 那样借 tmux 开一个 pty。</p>',
      hup: null },
  ];
  const svg = $('#svg'), info = $('#info');
  let cur = SC[0], busy = false, done = false;
  SC.forEach((sc, i) => {
    const b = document.createElement('button'); b.className = 'btn' + (i === 0 ? ' on' : ''); b.textContent = sc.tab;
    b.onclick = () => { $$('#tabs .btn').forEach((x) => x.classList.remove('on')); b.classList.add('on'); cur = sc; draw(); };
    $('#tabs').appendChild(b);
  });
  function draw() {
    done = false;
    svg.innerHTML = '';
    if (cur.region) {
      const g = S('g', { class: 'region' }, svg);
      S('rect', { x: cur.region.x, y: cur.region.y, width: cur.region.w, height: cur.region.h, rx: 14 }, g);
      S('text', { x: cur.region.x + 12, y: cur.region.y + cur.region.h - 10, text: cur.region.l }, g);
    }
    cur.edges.forEach((e, i) => {
      const g = S('g', { class: `te k-${e.k}`, 'data-a': e.a, 'data-b': e.b }, svg);
      const pid = `te-${cur.id}-${i}`;
      S('path', { d: e.d, id: pid }, g);
      if (!RM) {
        const dur = (2.2 + (i % 3) * 0.35) + 's';
        const c1 = S('circle', { r: 4 }, g);
        const m1 = S('animateMotion', { dur, repeatCount: 'indefinite' }, c1); S('mpath', { href: '#' + pid }, m1);
        if (e.flow !== 'fwd') {
          const c2 = S('circle', { r: 4 }, g);
          const m2 = S('animateMotion', { dur, repeatCount: 'indefinite', keyPoints: '1;0', keyTimes: '0;1', calcMode: 'linear', begin: '-1.1s' }, c2);
          S('mpath', { href: '#' + pid }, m2);
        }
      }
      if (e.l) S('text', { x: e.lx, y: e.ly, 'text-anchor': e.anchor || 'middle', text: e.l }, g);
    });
    cur.nodes.forEach((n) => {
      const g = S('g', { class: `tn k-${n.k}`, id: `tn-${n.id}` }, svg);
      S('rect', { class: 'box', x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }, g);
      const cy = n.y + n.h / 2;
      S('text', { class: 't1', x: n.x + n.w / 2, y: n.s ? cy - 3 : cy + 5, 'text-anchor': 'middle', text: n.t }, g);
      if (n.s) S('text', { class: 't2', x: n.x + n.w / 2, y: cy + 16, 'text-anchor': 'middle', text: n.s }, g);
      if (n.vt) {
        const vg = S('g', { class: 'vt' }, g);
        const w = textW(n.vt) + 18, right = n.x + n.w + 8;
        S('rect', { x: right - w, y: n.y - 11, width: w, height: 21, rx: 10.5 }, vg);
        S('text', { x: right - w / 2, y: n.y + 3.5, 'text-anchor': 'middle', text: n.vt }, vg);
      }
      if (n.badge) { const bg = S('g', { class: 'badge' }, g); S('circle', { cx: n.x + 16, cy: n.y + 16, r: 6, fill: n.badge }, bg); }
      S('text', { class: 'stat', x: n.x + n.w / 2, y: n.y + n.h + 17, 'text-anchor': 'middle', text: '' }, g);
    });
    const facts = Object.entries(cur.facts).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    info.innerHTML = `<div><h3>${cur.tab}</h3><dl class="facts">${facts}</dl>` +
      `<div class="hup"><button class="btn" id="hup" ${cur.hup ? '' : 'disabled'}>${cur.hup ? '✕ 关闭外层终端窗口' : '这个场景没有终端窗口'}</button><div class="hup-log" id="hup-log"></div></div></div>` +
      `<div class="note">${cur.note}</div>`;
    $('#hup').onclick = () => done ? draw() : hup();
  }
  async function hup() {
    if (busy || !cur.hup) return;
    busy = true;
    const sc = cur, btn = $('#hup'), logEl = $('#hup-log');
    btn.disabled = true;
    const state = {};
    const bad = (s) => s === 'dead' || s === 'closed';
    for (const [id, st, msg] of sc.hup) {
      if (cur !== sc) break;
      state[id] = st;
      const g = $(`#tn-${id}`);
      g.classList.add(st);
      g.querySelector('.stat').textContent = msg;
      $$('.te', svg).forEach((e) => { if (bad(state[e.dataset.a]) || bad(state[e.dataset.b])) e.classList.add('cut'); });
      if (msg) logEl.textContent = (st === 'alive' ? '✓ ' : st === 'suspend' ? '◐ ' : '✕ ') + `${g.querySelector('.t1').textContent}：${msg}`;
      await sleep(520);
    }
    if (cur === sc) {
      const survived = sc.hup.some((h) => h[1] === 'alive' || h[1] === 'suspend');
      logEl.textContent = survived ? '外层窗口关掉以后，持有 pane master 的守护进程和它下面的程序都还在。' : '这条链上没有哪个进程独立持有 master，SIGHUP 一路传到了底。';
      btn.disabled = false; btn.textContent = '⟲ 重置'; done = true;
    }
    busy = false;
  }
  draw();
})();
</script>
</body>
</html>
