<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一个面板拆成 GPUI 的五种图元</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #faf9f5; --bg-soft: #f0eee6; --text: #141413; --text-soft: #3d3c38; --muted: #5e5d59; --faint: #87867f;
  --border: #e8e6dc; --border-strong: #d8d4c7; --accent: #d97757;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: var(--font-sans); color: var(--text); font-size: 14px; line-height: 1.6; padding: 16px 18px 14px; -webkit-font-smoothing: antialiased; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.btn { border: 1px solid var(--text); background: var(--text); color: var(--bg); border-radius: 999px; padding: 4px 14px; font: 500 12.5px var(--font-sans); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend span { display: inline-flex; align-items: center; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border-strong); cursor: default; transition: background .2s; }
.legend span:hover { background: var(--bg-soft); }
.legend i { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.stage { height: 400px; perspective: 1300px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 10px; background: radial-gradient(ellipse at 50% 60%, #f3f0e7, #e9e5da); }
.scene { position: relative; width: 320px; height: 236px; flex: none; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.65,0,.25,1); }
.scene.x { transform: rotateX(56deg) rotateZ(-32deg) scale(.8); }
.layer { position: absolute; inset: 0; transition: transform 1.1s cubic-bezier(.65,0,.25,1), opacity .3s; }
.layer .plane { position: absolute; inset: -10px; border-radius: 16px; border: 1.5px dashed transparent; transition: all .6s; }
.scene.x .layer .plane { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 10%, transparent); }
.layer .tag { position: absolute; left: -10px; top: -34px; font-size: 17px; font-weight: 600; color: var(--pc); opacity: 0; transition: opacity .5s; white-space: nowrap; }
.scene.x .layer .tag { opacity: 1; }
.layer.dim { opacity: .12; }
.pc { position: absolute; }
.cap { margin-top: 10px; color: var(--muted); font-size: 12px; }
@media (max-width: 480px) { .stage { height: 320px; } .scene { transform: scale(.82); } .scene.x { transform: rotateX(56deg) rotateZ(-32deg) scale(.62); } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="ctrls">
  <button class="btn" id="btn">拆成图元</button>
  <div class="legend" id="legend"></div>
</div>
<div class="stage"><div class="scene" id="scene"></div></div>
<div class="cap">仿 confdeck 菜单栏面板的示意，按 GPUI 的五种图元分层。鼠标移到图例上，只看那一层。</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const CAT = [['shadow', '阴影', '#87867f'], ['rect', '矩形', '#d97757'], ['image', '图片', '#788c5d'], ['icon', '图标', '#6a9bcc'], ['text', '文字', '#141413']];
  const ava = (a, b) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="20" height="20" rx="5" fill="url(#g)"/><circle cx="10" cy="10" r="4" fill="#fff" opacity=".9"/></svg>`);
  const chev = '<svg viewBox="0 0 10 10" width="10" height="10"><path d="M2 3.5 5 6.5 8 3.5" stroke="#5e5d59" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
  const gear = '<svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#5e5d59" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#5e5d59" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const winIcon = '<svg viewBox="0 0 14 14" width="13" height="13"><rect x="1.5" y="2.5" width="11" height="9" rx="2" fill="none" stroke="#5e5d59" stroke-width="1.3"/><path d="M1.5 5h11" stroke="#5e5d59" stroke-width="1.3"/></svg>';
  const P = { shadow: [], rect: [], image: [], icon: [], text: [] };
  P.shadow.push({ x: 0, y: 0, w: 320, h: 236, s: 'border-radius:12px;box-shadow:0 18px 40px rgba(20,20,19,.28),0 0 0 .5px rgba(20,20,19,.18)' });
  P.rect.push({ x: 0, y: 0, w: 320, h: 236, s: 'border-radius:12px;background:#f7f5ef' });
  P.rect.push({ x: 0, y: 44, w: 320, h: 1, s: 'background:#e3dfd3' });
  P.rect.push({ x: 8, y: 52, w: 304, h: 40, s: 'border-radius:8px;background:#ebe7dc' });
  P.rect.push({ x: 0, y: 196, w: 320, h: 40, s: 'background:#efece3;border-radius:0 0 12px 12px' });
  const rows = [['Claude Code', 'Kimi For Coding', '#d97757', '#f0c36d'], ['Codex', 'OpenRouter', '#6a9bcc', '#9dbfe0'], ['Pi', '3 家', '#788c5d', '#c8d6a8']];
  rows.forEach(([name, pill, c1, c2], i) => {
    const y = 52 + i * 44;
    P.shadow.push({ x: 188, y: y + 8, w: 120, h: 24, s: 'border-radius:12px;box-shadow:0 1px 3px rgba(20,20,19,.18)' });
    P.rect.push({ x: 188, y: y + 8, w: 120, h: 24, s: 'border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #d8d4c7' });
    P.image.push({ x: 16, y: y + 10, w: 20, h: 20, html: `<img src="${ava(c1, c2)}" width="20" height="20" alt="" style="display:block">` });
    P.icon.push({ x: 292, y: y + 15, w: 10, h: 10, html: chev });
    P.text.push({ x: 46, y: y + 11, html: `<span style="font-size:13px;color:#3d3c38">${name}</span>` });
    P.text.push({ x: 200, y: y + 12, html: `<span style="font-size:11.5px;color:#141413">${pill}</span>` });
  });
  P.icon.push({ x: 290, y: 15, w: 15, h: 15, html: gear });
  P.icon.push({ x: 16, y: 210, w: 13, h: 13, html: winIcon });
  P.text.push({ x: 16, y: 13, html: '<span style="font-size:13.5px;font-weight:600;color:#141413">confdeck</span>' });
  P.text.push({ x: 36, y: 208, html: '<span style="font-size:12px;color:#5e5d59">打开主窗口</span>' });

  const scene = $('#scene');
  const layers = CAT.map(([k, label, color]) => {
    const L = document.createElement('div');
    L.className = 'layer';
    L.style.setProperty('--pc', color);
    L.innerHTML = `<div class="plane"></div><div class="tag">${label}</div>`;
    for (const p of P[k]) {
      const e = document.createElement('div');
      e.className = 'pc';
      e.style.cssText = `left:${p.x}px;top:${p.y}px;${p.w ? `width:${p.w}px;` : ''}${p.h ? `height:${p.h}px;` : ''}${p.s || ''}`;
      if (p.html) e.innerHTML = p.html;
      L.append(e);
    }
    scene.append(L);
    return L;
  });
  let open = false;
  function apply() {
    scene.classList.toggle('x', open);
    layers.forEach((L, i) => { L.style.transform = open ? `translateZ(${(i - 2) * 50}px)` : ''; });
    $('#btn').textContent = open ? '合上' : '拆成图元';
  }
  $('#btn').addEventListener('click', () => { open = !open; apply(); });
  const legend = $('#legend');
  CAT.forEach(([, label, color], i) => {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${color}"></i>${label}`;
    s.addEventListener('mouseenter', () => layers.forEach((L, j) => L.classList.toggle('dim', j !== i)));
    s.addEventListener('mouseleave', () => layers.forEach((L) => L.classList.remove('dim')));
    legend.append(s);
  });
  // 滚到眼前时自动拆开一次。
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) {
      io.disconnect();
      setTimeout(() => { if (!open) { open = true; apply(); } }, 400);
    }
  }, { threshold: 0.6 });
  io.observe($('.stage'));
})();
</script>
</body>
</html>
